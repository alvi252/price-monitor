[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "price-monitor"
version = "0.1.0"
description = "Competitor price & stock monitor for online shops: async scraper, SQLite snapshots, change detection, Excel/CSV/HTML reports and alerts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aleks T." }]
requires-python = ">=3.11"
keywords = ["web-scraping", "price-monitoring", "e-commerce", "httpx", "automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Office/Business",
]
dependencies = [
    "httpx>=0.27,<1",
    "selectolax>=0.3.21",
    "openpyxl>=3.1,<4",
    "jinja2>=3.1,<4",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
# Google Sheets report output (imported lazily; the base install does not need it).
sheets = ["gspread>=6,<7"]
dev = ["pytest>=8", "ruff>=0.6"]
# Only needed to regenerate the README screenshots (scripts/capture_screenshots.py).
screenshots = ["playwright>=1.45"]

[project.scripts]
price-monitor = "price_monitor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/price_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
# Test the source tree even when the package is installed non-editable.
pythonpath = ["src"]
addopts = "-ra --doctest-modules"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH", "N"]
